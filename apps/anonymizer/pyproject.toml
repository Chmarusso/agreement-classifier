[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer"
version = "1.0.0"
description = "Local PII anonymizer for Polish and English legal agreements"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ner = ["spacy>=3.8"]

[project.scripts]
anonymizer = "anonymizer.cli:main"
anonymizer-server = "anonymizer.server:main"

[tool.setuptools]
packages = ["anonymizer"]

[tool.ruff]
line-length = 110
